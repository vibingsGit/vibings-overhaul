name: Vibings Scene Heatmap
description: Shows a curve of the most watched parts of a video over the
  player's timeline, from the parts you have actually watched.
url: https://github.com/vibingsGit/vibings-overhaul
version: 1.0.0
ui:
  javascript:
    - VibingsSceneHeatmap.js
exec:
  - python3
  - "{pluginDir}/vibings_scene_heatmap.py"
interface: raw
